  LambdaGetAccountsRegionsDetailsFunction:
    Type: AWS::Lambda::Function
    Properties:
      Description: 'AWS COA - Lambda Function that list of accounts in the organization and active regions in AWS Compute Optimizer per account'
      FunctionName: !Sub ${AWS::StackName}-COA-get-accounts-regions-details
      Handler: index.lambda_handler
      Runtime: python3.13
      Role: !GetAtt 'LambdaGetAccountsRegionsDetailsRole.Arn'
      MemorySize: 128
